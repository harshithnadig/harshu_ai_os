[project]
name = "harshu-ai-os"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "ddgs>=9.14.4",
    "fastapi>=0.139.1",
    "google-genai>=2.12.1",
    "langchain>=1.3.14",
    "langchain-google-genai>=4.3.1",
    "langchain-groq>=1.1.3",
    "litellm<1.50",
    "numpy>=2.5.1",
    "python-dotenv==1.2.2",
    "scikit-learn>=1.9.0",
    "tenacity>=9.1.4",
    "uvicorn>=0.51.0",
]

[project.optional-dependencies]
# Reranking is a learning experiment, so its large ML stack is optional.
reranking = ["sentence-transformers>=5.7.0", "einops>=0.8.0"]

[build-system]
requires = ["uv_build>=0.11.28,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "pytest>=9.1.1",
    "rank-bm25>=0.2.2",
    "ruff>=0.15.21",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["src/harshu_ai_os/tests"]

[tool.uv.sources]
torch = [{ index = "pytorch" }]
torchvision = [{ index = "pytorch" }]
torchaudio = [{ index = "pytorch" }]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu121"
explicit = true


[tool.ruff]
src = ["src"]
line-length = 120

[tool.ruff.lint]
select = ["E", "F"]
ignore = ["E402", "E501"]
