services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: harshu-ai-os-app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - HARSHU_AI_OS_MODE=${HARSHU_AI_OS_MODE:-development}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - OMNIROUTE_BASE_URL=${OMNIROUTE_BASE_URL:-http://127.0.0.1:20128/v1}
      - OMNIROUTE_API_KEY=${OMNIROUTE_API_KEY:-}
    volumes:
      - ./data:/app/data
    networks:
      - harshu-network
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')\""]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  harshu-network:
    driver: bridge
