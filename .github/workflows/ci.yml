name: CI

on:
  push:
  pull_request:

jobs:
  test-and-build:
    name: Test & Build Docker
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "latest"
          enable-cache: true

      - name: Install project dependencies
        run: uv sync --frozen

      - name: Run test suite
        run: uv run pytest

      - name: Run RAG retrieval quality gate
        run: uv run python src/harshu_ai_os/evaluations/run_evaluation.py

      - name: Build Docker image
        run: docker build -t harshu-ai-os .
